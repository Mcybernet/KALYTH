name: Devnet demo trades

# Small randomized buy/sell activity for the Devnet test deployment.
#
# This workflow is opt-in for the schedule: it only runs automatically when the
# repository variable DEMO_TRADING_ENABLED is set to `true`. Set it to `false`
# to stop the bot. Manual "Run workflow" dispatches always run so a test can be
# started even while the schedule is paused.
#
# Required secrets:
#   DEVNET_RPC_URL       Devnet RPC endpoint (use a dedicated provider if the
#                        public endpoint rate-limits)
#   DEMO_TRADE_KEYPAIR   funded Devnet-only keypair (JSON array or base58)
#
# Never reuse this keypair for the burn crank, treasury, or any mainnet wallet.

on:
  schedule:
    # GitHub cron is best-effort and can be delayed. The script adds its own
    # random delay between trades, so a fixed cadence still looks organic.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate the trades without sending a transaction'
        type: boolean
        default: true
      trades:
        description: 'Number of trades this run (1-5)'
        type: number
        default: 2

permissions:
  contents: read

concurrency:
  group: devnet-demo-trades
  cancel-in-progress: false

jobs:
  trade:
    if: vars.DEMO_TRADING_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Show configuration
        run: |
          echo "event: ${{ github.event_name }}"
          echo "DEMO_TRADING_ENABLED=[${{ vars.DEMO_TRADING_ENABLED }}]"
          echo "DEMO_WALLET_ADDRESS=[${{ vars.DEMO_WALLET_ADDRESS }}]"

      - name: Run demo trader
        run: node demo-trade.mjs
        env:
          DEVNET_RPC_URL: ${{ secrets.DEVNET_RPC_URL }}
          DEMO_TRADE_KEYPAIR: ${{ secrets.DEMO_TRADE_KEYPAIR }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
          DEMO_TRADES_PER_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.trades) || '2' }}
          DEMO_MIN_TRADE_SOL: '0.002'
          DEMO_MAX_TRADE_SOL: '0.02'
          DEMO_MIN_SOL_BUFFER: '0.005'
