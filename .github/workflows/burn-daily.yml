name: Daily KLYTH burn

on:
  schedule:
    # Four attempts a day. The on-chain 23h50m window turns the extra runs into
    # no-ops, while the 6-hour cadence protects against runner delay or RPC
    # rate limiting.
    - cron: '5 0 * * *'
    - cron: '5 6 * * *'
    - cron: '5 12 * * *'
    - cron: '5 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate the burn without sending a transaction'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-klyth-burn
  cancel-in-progress: false

jobs:
  burn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify on-chain burn setup
        run: node verify-burn-setup.mjs
        continue-on-error: true
        env:
          DEVNET_RPC_URL: ${{ secrets.DEVNET_RPC_URL }}

      - name: Burn min(daily cap, reserve)
        run: node burn-daily.mjs
        env:
          DEVNET_RPC_URL: ${{ secrets.DEVNET_RPC_URL }}
          BURN_CRANK_KEYPAIR: ${{ secrets.BURN_CRANK_KEYPAIR }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
