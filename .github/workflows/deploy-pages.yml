name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/frontend/**'
      - 'scripts/build-ohlc-json.mjs'
      - 'scripts/burn-common.mjs'
      - 'scripts/package.json'
      - 'scripts/package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  schedule:
    # Refresh the OHLC snapshot and redeploy. GitHub cron is UTC and
    # best-effort; a missed slot is harmless because the snapshot is extended
    # from the history it already has.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            scripts/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install snapshot dependencies
        working-directory: scripts
        run: npm ci

      - name: Build OHLC snapshot
        working-directory: scripts
        continue-on-error: true
        timeout-minutes: 15
        env:
          DEVNET_RPC_URL: ${{ secrets.DEVNET_RPC_URL }}
        run: |
          # `base_url` already contains the project path for project sites
          # (for example https://user.github.io/repo); do not append
          # `base_path` or the path is doubled.
          BASE="${{ steps.pages.outputs.base_url }}"
          BASE="${BASE%/}"
          node build-ohlc-json.mjs \
            --output ../app/frontend/public/data/klyth-trades.json \
            --base "$BASE/data/klyth-trades.json"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # `base_path` is `/repo-name` for project sites and empty for
          # user/org sites. vite.config.ts normalises the trailing slash.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
          # Optional: marks demo-wallet trades in the activity tables.
          VITE_DEMO_WALLET_ADDRESS: ${{ vars.DEMO_WALLET_ADDRESS }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
